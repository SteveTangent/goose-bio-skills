interface:
  display_name: "Alignment File Operations"
  short_description: "Perform bounded, auditable operations on existing alignment files without changing biological meaning silently."
  default_prompt: "Check this BAM header, sort it by coordinate and extract chr2:1-10000 into a new file."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
