interface:
  display_name: "Sequence I/O and Transformation"
  short_description: "Read, transform and write sequence records with explicit loss and round-trip checks."
  default_prompt: "Convert this FASTQ subset to FASTA and report which metadata will be lost."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
