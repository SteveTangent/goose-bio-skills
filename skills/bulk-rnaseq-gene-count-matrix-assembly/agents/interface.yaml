interface:
  display_name: "Bulk RNA-seq Gene-count Matrix Assembly"
  short_description: "Assemble matched sample gene counts into one matrix."
  default_prompt: "Use $bulk-rnaseq-gene-count-matrix-assembly to assemble these completed matching single-sample raw gene-count JSON reports into one deterministic gene-by-sample JSON matrix."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
