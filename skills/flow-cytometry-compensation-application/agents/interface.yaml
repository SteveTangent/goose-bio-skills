interface:
  display_name: "Flow Cytometry Compensation Application"
  short_description: "Apply one declared spillover matrix to local event values."
  default_prompt: "Apply this exact spillover matrix to the matching channels in my extracted local event table and create compensated events plus a provenance report. Do not estimate compensation, transform, gate, or label cells."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
