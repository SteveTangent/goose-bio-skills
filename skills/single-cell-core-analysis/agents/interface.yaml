interface:
  display_name: "Single-cell Core Analysis"
  short_description: "Produce a reproducible exploratory embedding and clustering baseline from an explicitly validated single-cell object."
  default_prompt: "Normalize and cluster this QC-approved PBMC count object with a reproducible small-data workflow."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
