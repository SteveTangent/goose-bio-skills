interface:
  display_name: "Single Cell Core Analysis"
  short_description: "Run a bounded exploratory Scanpy RNA baseline from an exact matching QC object and receipt."
  default_prompt: "Run a bounded exploratory Scanpy RNA baseline from an exact matching QC object and receipt. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
