interface:
  display_name: "Count-based Differential Expression"
  short_description: "Estimate a declared contrast from counts with a defensible design, diagnostics and multiple-testing record."
  default_prompt: "Compare treated versus control samples in this raw count matrix while adjusting for batch."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
