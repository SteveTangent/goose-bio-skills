interface:
  display_name: "Raw Read Quality Reporting"
  short_description: "Summarize existing bounded FastQC text or ZIP reports and preserve module warning flags."
  default_prompt: "Summarize existing bounded FastQC text or ZIP reports and preserve module warning flags. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
