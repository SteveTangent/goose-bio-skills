interface:
  display_name: "Bounded Missing-outcome Sensitivity"
  short_description: "Profile missing outcomes and run declared aggregate sensitivity scenarios."
  default_prompt: "Profile missingness for the continuous outcome in this local table, optionally by my declared group column, and write a new JSON report using my declared outcome bounds and explicit delta grid without imputing rows."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
