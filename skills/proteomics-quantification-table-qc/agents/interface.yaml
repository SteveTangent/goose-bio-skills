interface:
  display_name: "Proteomics Quantification Table QC"
  short_description: "Assess peptide or protein abundance tables for modeling readiness."
  default_prompt: "Review this already quantified protein-abundance table and sample metadata for joins, duplicates, missing-versus-zero semantics, distributions, replication, and confounding; do not normalize, impute, or fit a model."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
