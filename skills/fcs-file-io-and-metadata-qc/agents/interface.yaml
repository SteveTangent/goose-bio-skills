interface:
  display_name: "FCS File I/O and Metadata QC"
  short_description: "Inspect bounded FCS structure and channel metadata safely."
  default_prompt: "Inspect these explicitly named local FCS files for structure, datasets, event and channel counts, channel labels and scaling keywords, time, and spillover declarations; remain metadata-only unless I explicitly request bounded event statistics."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
