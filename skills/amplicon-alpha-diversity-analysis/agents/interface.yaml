interface:
  display_name: "Amplicon Alpha Diversity Analysis"
  short_description: "Calculate bounded per-sample alpha diversity locally."
  default_prompt: "Calculate observed features, natural-log Shannon diversity, and Simpson diversity for each sample in this local feature-by-sample integer TSV, return explicit not-estimable results for zero-depth samples, and write a new descriptive JSON report."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
