interface:
  display_name: "Two-Group Log-Rank Comparison"
  short_description: "Compare two right-censored groups with a log-rank test."
  default_prompt: "Use $two-group-log-rank-survival-comparison to compare exactly two prespecified groups in this local right-censored survival TSV and write a new JSON report without a significance decision."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
