interface:
  display_name: "Independent 2×2 Categorical Comparison"
  short_description: "Compare one independent 2x2 count table with Fisher test and conditional odds ratio."
  default_prompt: "Compare one independent 2x2 count table with Fisher test and conditional odds ratio. Inspect available facts first, clarify the first consequential unknown, preserve units and independent samples, and deliver the bounded result with its limits."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
