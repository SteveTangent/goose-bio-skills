interface:
  display_name: "Multi Comparison Result Concordance"
  short_description: "Compare membership and effect direction across two to five existing result tables."
  default_prompt: "Compare membership and effect direction across two to five existing result tables. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
