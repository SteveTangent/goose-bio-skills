interface:
  display_name: "Environment and Provenance Capture"
  short_description: "Create a portable, read-only provenance record for one planned or completed computational analysis."
  default_prompt: "Create a reproducibility manifest for this RNA-seq analysis, including package and reference versions."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
