interface:
  display_name: "GFF/GTF Gene-model Structural QC"
  short_description: "Audit bounded local gene-model structure against exact contig sizes."
  default_prompt: "Structurally audit this local GFF3 gene model against its exact reference .fai and write a new JSON report without repairing or overwriting anything."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
