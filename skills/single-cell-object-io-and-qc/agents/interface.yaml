interface:
  display_name: "Single Cell Object Io And Qc"
  short_description: "Inspect and explicitly filter a small RNA h5ad with authoritative counts and biological sample metadata."
  default_prompt: "Inspect and explicitly filter a small RNA h5ad with authoritative counts and biological sample metadata. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
