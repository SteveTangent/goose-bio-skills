interface:
  display_name: "Public Sequencing Run Manifest Retrieval"
  short_description: "Resolve existing public sequencing accessions into a bounded run and file manifest."
  default_prompt: "Retrieve the public run manifest for these exact accessions, including sample, layout, platform, file URL, byte size, MD5, and request provenance; do not download reads."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
