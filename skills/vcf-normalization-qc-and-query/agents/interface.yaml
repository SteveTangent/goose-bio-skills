interface:
  display_name: "VCF Normalization, QC and Query"
  short_description: "Produce an auditable normalized or filtered variant representation and QC findings from an existing callset."
  default_prompt: "Left-normalize this small VCF against the pinned reference and list REF mismatches."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
