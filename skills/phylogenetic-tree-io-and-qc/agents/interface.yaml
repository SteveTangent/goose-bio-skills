interface:
  display_name: "Phylogenetic Tree I/O and QC"
  short_description: "Validate bounded local Newick trees and report structural QC."
  default_prompt: "Check this local Newick tree, optionally require an exact tip-set match with a second tree, and write a new deterministic structural QC report without changing either tree."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
