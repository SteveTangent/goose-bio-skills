interface:
  display_name: "Pairwise and Multiple Sequence Alignment"
  short_description: "Produce an alignment fit for a declared downstream purpose and report sensitivity to key alignment choices."
  default_prompt: "Create a protein MSA for these eight sequences and flag poorly aligned regions."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
