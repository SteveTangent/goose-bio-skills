interface:
  display_name: "Bioinformatics Result Visualization"
  short_description: "Export source-backed volcano, PCA, heatmap, group, correlation, concordance, marker or embedding figures."
  default_prompt: "Export source-backed volcano, PCA, heatmap, group, correlation, concordance, marker or embedding figures. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
