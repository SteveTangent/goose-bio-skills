interface:
  display_name: "Flow Cytometry Arcsinh Transformation"
  short_description: "Apply declared channel cofactors to extracted events."
  default_prompt: "Apply these explicit arcsinh cofactors to the selected channels in my extracted local event table and create transformed events plus a provenance report. Do not estimate cofactors, compensate, gate, or label cells."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
