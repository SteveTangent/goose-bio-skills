interface:
  display_name: "Kaplan-Meier Survival Analysis"
  short_description: "Summarize local right-censored subject tables."
  default_prompt: "Summarize this local subject-level time-to-event TSV with deterministic Kaplan-Meier estimates, medians, and at-risk/event/censor counts, optionally by one declared group column, and write a new descriptive JSON report without hypothesis testing."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
