interface:
  display_name: "Bioinformatics Format And Identifier Validation"
  short_description: "Validate and explicitly align sample metadata with a declared feature-by-sample matrix."
  default_prompt: "Validate and explicitly align sample metadata with a declared feature-by-sample matrix. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
