interface:
  display_name: "Two Group Comparison And Effect Estimation"
  short_description: "Estimate a continuous-outcome difference between two independent or paired groups."
  default_prompt: "Estimate a continuous-outcome difference between two independent or paired groups. Inspect my inputs and clarify only facts that change the analysis."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
