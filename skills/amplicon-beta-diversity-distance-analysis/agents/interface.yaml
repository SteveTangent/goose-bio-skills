interface:
  display_name: "Amplicon Beta-Diversity Distance Analysis"
  short_description: "Calculate bounded pairwise beta-diversity distances."
  default_prompt: "Calculate upper-triangle Bray-Curtis and presence/absence Jaccard distances from this local feature-by-sample integer TSV, return structured not-estimable metrics for pairs involving a zero-depth sample, and write a new descriptive JSON report."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    generic: "neutral-source"
