name: Package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Diagnose connector portability
        run: python3 scripts/run_research_connector.py --self-test
        continue-on-error: true
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.4.1'
          use-public-rspm: false
      - name: Install the existing fixed limma adapter dependency
        shell: Rscript {0}
        run: |
          install.packages("https://bioconductor.org/packages/3.19/bioc/src/contrib/limma_3.60.6.tar.gz", repos = NULL, type = "source")
          stopifnot(as.character(getRversion()) == "4.4.1", as.character(packageVersion("limma")) == "3.60.6")
      - name: Expose the fixed R installation to the existing adapter
        shell: bash
        run: |
          PINNED_RSCRIPT=$(python3 -c 'import pathlib, shutil; print(pathlib.Path(shutil.which("Rscript")).resolve())')
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$PINNED_RSCRIPT" /usr/local/bin/Rscript
      - name: Validate packages and deterministic helper contracts
        run: python3 scripts/verify.py quick
        env:
          PYTHONDONTWRITEBYTECODE: "1"
