name: Package checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check connector portability
        run: python3 scripts/run_research_connector.py --self-test
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: '4.4.1'
          use-public-rspm: false
      - name: Download the fixed limma archive
        shell: bash
        run: |
          # Fixed archive from mirrors listed by Bioconductor; never resolve latest.
          for mirror in https://bioconductor.posit.co https://bioconductor.statistik.tu-dortmund.de https://bioconductor.org; do
            if curl --fail --location --retry 1 --connect-timeout 15 --max-time 60 --max-filesize 8388608 \
              "$mirror/packages/3.19/bioc/src/contrib/limma_3.60.6.tar.gz" \
              --output "$RUNNER_TEMP/limma_3.60.6.tar.gz"; then
              break
            fi
          done
          echo "95cc480268b8e463cf142d99c392a919b327416ea2de94bbbec5c4c6d75213a7  $RUNNER_TEMP/limma_3.60.6.tar.gz" | shasum -a 256 -c -
      - name: Install the existing fixed limma adapter dependency
        shell: Rscript {0}
        run: |
          install.packages("https://cran.r-project.org/src/contrib/Archive/statmod/statmod_1.5.0.tar.gz", repos = NULL, type = "source")
          install.packages(file.path(Sys.getenv("RUNNER_TEMP"), "limma_3.60.6.tar.gz"), repos = NULL, type = "source")
          stopifnot(as.character(getRversion()) == "4.4.1", as.character(packageVersion("limma")) == "3.60.6", as.character(packageVersion("statmod")) == "1.5.0")
      - name: Expose the fixed R installation to the existing adapter
        shell: bash
        run: |
          PINNED_RSCRIPT=$(python3 -c 'import pathlib, shutil; print(pathlib.Path(shutil.which("Rscript")).resolve())')
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$PINNED_RSCRIPT" /usr/local/bin/Rscript
          # The existing limma worker deliberately excludes R_LIBS_USER from its environment.
          PINNED_R_LIBRARY=$("$PINNED_RSCRIPT" --vanilla -e 'cat(R.home("library"))')
          sudo cp -R "$R_LIBS_USER/limma" "$R_LIBS_USER/statmod" "$PINNED_R_LIBRARY/"
      - name: Validate packages and deterministic helper contracts
        run: python3 scripts/verify.py quick
        env:
          PYTHONDONTWRITEBYTECODE: "1"
